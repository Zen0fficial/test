[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "futu-desktop-bridge"
version = "0.4.0"
description = "Read-only Futu and Polymarket data API and research exports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
native = ["frida>=17.24,<18", "tzdata>=2024.1; platform_system == 'Windows'"]
research = ["pypdf>=5,<6"]
qlib = ["pyqlib==0.9.7", "pypdf>=5,<6"]
polymarket = ["websocket-client>=1.9,<2"]
converters = ["tzdata>=2024.1; platform_system == 'Windows'"]
ml = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2", "tzdata>=2024.1; platform_system == 'Windows'"]

[project.scripts]
futu-bridge = "futu_bridge.server:main"
futu-qlib-export = "futu_bridge.qlib_export:main"
futu-deepseek-extract = "futu_bridge.deepseek_extractor:main"
polymarket-data = "futu_bridge.polymarket_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["futu_bridge*"]
exclude = ["futu_bridge.tests*"]

[tool.setuptools.package-data]
futu_bridge = ["*.js", "asset_fixtures.json", "market_universe.json", "polymarket_endpoints.json", "equity_filter_config.json"]
"futu_bridge.converters" = ["*.cs"]
"futu_bridge.joint" = ["QLIB_NOTICE.txt"]
